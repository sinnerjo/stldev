<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Don't Wake Gabby! | STLDev</title>
<meta name="description" content="A silly tiptoe game! Sneak around your big sister's room, play freeze when she rolls over, and tap along to her snores without waking her up.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😴</text></svg>">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #171331; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif; color: #fff; }
  #wrap { position: relative; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); width: min(100vw, calc(100dvh * 16 / 9)); height: min(100dvh, calc(100vw * 9 / 16)); }
  canvas { display: block; width: 100%; height: 100%; border-radius: 6px; touch-action: none; }
  .ov { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(23, 19, 49, .55); }
  .ov.show { display: flex; }
  .card { background: linear-gradient(#f4ecff, #dcd0ff); color: #3b2370; border: 5px solid #8a5cf6; border-radius: 22px; padding: 1.5% 3%; text-align: center; max-width: 92%; max-height: 96%; overflow: auto; box-shadow: 0 8px 0 #5b34b8, 0 14px 30px rgba(0,0,0,.4); touch-action: manipulation; }
  .title { font-size: clamp(26px, 5vw, 58px); font-weight: 900; color: #8a5cf6; text-shadow: 3px 3px 0 #ffd6f0; line-height: 1; }
  .subtitle { font-size: clamp(12px, 1.8vw, 21px); font-weight: 800; color: #5b34b8; margin-top: 4px; }
  .card p { font-size: clamp(11px, 1.45vw, 16px); margin: .4em 0; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: .5em 0; }
  .mode { background: #fff; color: #3b2370; border: 4px solid #cbb8ff; border-radius: 18px; padding: .5em .4em; font-weight: 900; font-size: clamp(12px, 1.6vw, 19px); line-height: 1.15; }
  .mode .em { display: block; font-size: 2em; }
  .mode small { display: block; font-weight: 600; font-size: .66em; color: #6d55a8; margin-top: 3px; }
  .mode .stars { display: block; font-size: .8em; margin-top: 4px; letter-spacing: 1px; }
  .mode.sel { border-color: #ff5fa8; background: #fff0f8; box-shadow: 0 0 0 3px #ffb3d6; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: .45em 0; }
  button { font-family: inherit; cursor: pointer; border: none; touch-action: manipulation; }
  .btn { background: #ff5fa8; color: #fff; font-weight: 900; font-size: clamp(13px, 1.7vw, 20px); padding: .5em 1.1em; border-radius: 14px; box-shadow: 0 5px 0 #b8326f; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8326f; }
  .btn.primary { background: #3fa34d; box-shadow: 0 5px 0 #23702d; font-size: clamp(16px, 2.3vw, 28px); }
  .btn.alt { background: #6d55a8; box-shadow: 0 5px 0 #43307a; }
  .diff button { background: #fff; color: #3b2370; border: 4px solid #cbb8ff; border-radius: 16px; padding: .3em .9em; font-weight: 900; font-size: clamp(12px, 1.5vw, 18px); min-width: 30%; }
  .diff button small { display: block; font-weight: 600; font-size: .72em; color: #6d55a8; }
  .diff button.sel { border-color: #3fa34d; background: #e6ffe2; }
  .how { font-size: clamp(10px, 1.2vw, 14px); color: #6d55a8; margin-top: .4em; line-height: 1.45; }
  .stat { font-size: clamp(14px, 2vw, 22px); font-weight: 800; margin: .3em 0; line-height: 1.5; }
  .bigstars { font-size: clamp(28px, 5vw, 54px); letter-spacing: 6px; }
  #hudBtns { position: absolute; top: 1%; right: 1%; display: none; gap: 6px; }
  #hudBtns.show { display: flex; }
  #hudBtns button { background: rgba(255,255,255,.88); border-radius: 10px; font-size: clamp(13px, 1.8vw, 20px); width: 2.1em; height: 2.1em; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  #actBtn { position: absolute; right: 2%; bottom: 4%; display: none; width: clamp(74px, 12vw, 120px); height: clamp(74px, 12vw, 120px); border-radius: 50%; background: rgba(255,255,255,.9); border: 5px solid #ff5fa8; color: #b8326f; font-weight: 900; font-size: clamp(11px, 1.6vw, 17px); line-height: 1.1; box-shadow: 0 5px 0 rgba(0,0,0,.3); }
  #actBtn.show { display: block; }
  #actBtn.song { bottom: 22%; }
  #actBtn.on { background: #ffd6ea; transform: translateY(3px); }
  #actBtn .big { display: block; font-size: 2em; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="hudBtns">
    <button id="bPause" title="Pause (P)">⏸️</button>
    <button id="bSfx" title="Sound">🔊</button>
  </div>
  <button id="actBtn"><span class="big" id="actIcon">🏃</span><span id="actLabel">Run</span></button>

  <div class="ov show" id="ovMenu">
    <div class="card">
      <div class="title">😴 Don't Wake Gabby!</div>
      <div class="subtitle">Your big sister is napping. Be SUPER quiet... shhhh!</div>
      <div class="modes">
        <button class="mode" data-mode="0"><span class="em">🧸</span>Sneaky Mission<small>Tiptoe around her room and grab your stuff back</small><span class="stars" id="st0"></span></button>
        <button class="mode" data-mode="1"><span class="em">🚦</span>Freeze!<small>Creep closer while she snores. FREEZE when she peeks!</small><span class="stars" id="st1"></span></button>
        <button class="mode" data-mode="2"><span class="em">🎵</span>Snore Song<small>Tap along to her snores and decorate her bed</small><span class="stars" id="st2"></span></button>
      </div>
      <div class="row diff">
        <button data-diff="easy">🐣 Little Kid<small>heavy sleeper, 5 hearts</small></button>
        <button data-diff="normal">🦸 Big Kid<small>light sleeper, 3 hearts</small></button>
      </div>
      <button class="btn primary" id="bPlay">▶ Shhh... Let's Go!</button>
      <div class="how" id="howTxt"></div>
    </div>
  </div>

  <div class="ov" id="ovPause">
    <div class="card">
      <div class="title">Paused</div>
      <div class="subtitle">Gabby is still snoring... for now.</div>
      <div class="row" style="margin-top:.8em">
        <button class="btn primary" id="bResume">▶ Keep Going</button>
        <button class="btn alt" data-menu>🏠 Menu</button>
      </div>
    </div>
  </div>

  <div class="ov" id="ovOver">
    <div class="card">
      <div class="title">GABBY IS AWAKE! 😱</div>
      <div class="subtitle" id="overSub"></div>
      <div class="row" style="margin-top:.7em">
        <button class="btn primary" id="bRetry">🔄 Try Again</button>
        <button class="btn alt" data-menu>🏠 Menu</button>
      </div>
    </div>
  </div>

  <div class="ov" id="ovWin">
    <div class="card">
      <div class="title" id="winTitle">She's still asleep! 🤫</div>
      <div class="bigstars" id="winStars"></div>
      <div class="subtitle" id="winSub"></div>
      <div class="row" style="margin-top:.6em">
        <button class="btn primary" id="bNext">▶ Next Level</button>
        <button class="btn alt" data-menu>🏠 Menu</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 960, H = 540, FLOOR = 236;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function resize() {
  const r = $('wrap').getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(320, Math.round(r.width * dpr));
  cv.height = Math.max(180, Math.round(r.height * dpr));
}
addEventListener('resize', resize); resize();

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const settings = Object.assign({ diff: 'easy', sfx: true, mode: 0 }, store.get('gab_settings', {}));
const saveSettings = () => store.set('gab_settings', settings);
const best = store.get('gab_best', [[0, 0, 0], [0, 0, 0], [0, 0, 0]]);
const D = () => settings.diff === 'easy' ? { hearts: 5, noise: 0.7, decay: 1.3, slow: 1.2 } : { hearts: 3, noise: 1, decay: 1, slow: 1 };

/* ============ Sound (all made with WebAudio) ============ */
const Snd = {
  ctx: null, master: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination); } catch (e) { this.ctx = null; }
  },
  tone(f, d, type = 'square', v = 0.1, f2 = null, delay = 0) {
    if (!this.ctx || !settings.sfx) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.03);
  },
  noise(d, v, freq, delay = 0, type = 'lowpass', freq2 = null, swell = false) {
    if (!this.ctx || !settings.sfx) return;
    const c = this.ctx, t = c.currentTime + delay, len = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) { const k = i / len; data[i] = (Math.random() * 2 - 1) * (swell ? Math.sin(k * Math.PI) : 1 - k); }
    const s = c.createBufferSource(); s.buffer = buf; const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); if (freq2) f.frequency.exponentialRampToValueAtTime(freq2, t + d);
    const g = c.createGain(); g.gain.value = v;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  // the snore: a rumbly breath in, then a whistly breath out
  snoreIn(d = 0.55) { if (!this.ctx || !settings.sfx) return; const c = this.ctx, t = c.currentTime, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(58, t); o.frequency.linearRampToValueAtTime(74, t + d); f.type = 'lowpass'; f.frequency.value = 380; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.22, t + d * 0.7); g.gain.linearRampToValueAtTime(0.0001, t + d); o.connect(f); f.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.05); this.noise(d, 0.12, 500, 0, 'lowpass', 900, true); },
  snoreOut(d = 0.45) { this.noise(d, 0.16, 2400, 0, 'bandpass', 900, true); this.tone(1400, d * 0.8, 'sine', 0.025, 700); },
  step() { this.tone(rand(500, 600), 0.03, 'sine', 0.02); },
  creak() { this.tone(160, 0.45, 'sawtooth', 0.07, 240); this.tone(300, 0.35, 'square', 0.03, 180, 0.1); },
  squeak() { this.tone(1300, 0.12, 'square', 0.09, 1900); this.tone(1700, 0.16, 'square', 0.09, 1100, 0.13); },
  grab() { this.tone(880, 0.07, 'triangle', 0.08); this.tone(1320, 0.12, 'triangle', 0.08, null, 0.07); },
  stir() { this.tone(220, 0.3, 'sine', 0.06, 180); this.tone(196, 0.35, 'sine', 0.05, 150, 0.25); },
  mumble() { for (let i = 0; i < 4; i++) this.tone(rand(170, 260), 0.12, 'triangle', 0.05, rand(140, 220), i * 0.13); },
  peek() { this.tone(600, 0.08, 'square', 0.06); this.tone(450, 0.15, 'square', 0.06, null, 0.09); },
  wake() { this.noise(0.5, 0.3, 1200); [523, 659, 784].forEach((f, i) => this.tone(f, 0.12, 'sawtooth', 0.1, null, i * 0.08)); this.tone(900, 0.5, 'sawtooth', 0.1, 300, 0.25); },
  boing() { this.tone(200, 0.4, 'sine', 0.12, 600); },
  hit(perfect) { this.tone(perfect ? 1568 : 1175, 0.12, 'triangle', 0.07); this.tone(perfect ? 2093 : 1568, 0.1, 'sine', 0.04, null, 0.05); },
  miss() { this.tone(180, 0.2, 'square', 0.06, 120); },
  door() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.09, null, i * 0.08)); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, i === 6 ? 0.6 : 0.14, 'triangle', 0.08, null, i * 0.13)); },
  sad() { [392, 370, 349, 330].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.12, null, i * 0.25)); }
};

/* ============ State ============ */
let state = 'menu', mode = settings.mode | 0, level = 0, time = 0, hearts = 3;
let meter = 0, meterMax = 0, gab = null, boy = null, parts = [], banner = null, shake = 0, wakeT = 0, winT = 0, lvT = 0;
let items = [], hazards = [], carried = 0;
let fr = null;      // freeze mode data
let song = null;    // snore song data
let decor = [];     // things placed on the bed in snore song

const SLEEP_TALK = ['Nooo... that’s MY pizza...', 'Five more minutes...', 'Unicorns are real...', 'I’m the queen of tacos...', 'Mmm... puppy...', 'Don’t touch my slime...', 'Bubbles... so many bubbles...', '*snorrrt*'];
const WAKE_LINES = ['WHO’S IN MY ROOM?!', 'I CAN HEAR YOU!', 'GET OUUUUT!', 'I WAS SLEEPING!', 'MOOOOM!!'];
const BACK_TO_SLEEP = ['...must have been a dream. Zzz', '...weird. Zzz zzz', 'Hmph. Zzzz...'];

// ---- Sneaky Mission levels ----
const ROOM_SOLID = [
  { x: 300, y: FLOOR, w: 360, h: 98 },     // bed
  { x: 140, y: FLOOR, w: 150, h: 30 },     // dresser
  { x: 664, y: FLOOR, w: 84, h: 52 },      // nightstand
  { x: 800, y: 438, w: 118, h: 62 }        // toy chest
];
const SNEAK = [
  { name: 'Get Your Toys Back!', tip: 'Tiptoe to grab your toys, then sneak out the door. When she stirs, FREEZE!',
    items: [['🚗', 210, 380], ['🦖', 760, 330], ['🎮', 560, 470]],
    hazards: [['board', 420, 380, 120], ['duck', 690, 440]], light: [6, 9], lightLen: [2, 3] },
  { name: 'The Headphone Heist', tip: 'Squeaky ducks and creaky boards are LOUD. Go around them!',
    items: [['🎧', 860, 280], ['🧸', 330, 470], ['🪀', 640, 370], ['🦖', 200, 300]],
    hazards: [['board', 250, 420, 110], ['board', 520, 400, 130], ['duck', 760, 380], ['duck', 450, 480], ['duck', 870, 380]], light: [5, 8], lightLen: [2, 3.2] },
  { name: 'Operation Dinosaur', tip: 'She is a light sleeper tonight. Hold Run only when she is snoring loud!',
    items: [['🦕', 880, 300], ['🎮', 120, 470], ['🚀', 720, 470], ['🧸', 470, 360], ['🎨', 260, 300]],
    hazards: [['board', 300, 380, 120], ['board', 580, 450, 120], ['board', 760, 330, 90], ['duck', 420, 450], ['duck', 640, 360], ['duck', 180, 420], ['duck', 860, 400]], light: [4, 7], lightLen: [2.2, 3.5] }
];
// ---- Freeze! levels ----
const FREEZE = [
  { name: 'Grab the TV Remote', tip: 'Hold to tiptoe while she snores. When she rolls over and peeks... FREEZE!', goal: '📺', path: [[70, 470], [380, 470], [610, 360], [700, 300]], snore: [2.2, 4], warn: 0.9, peek: [1.4, 2.4], fakes: 0 },
  { name: 'Rescue Mr. Snuggles', tip: 'She might fake you out! Wait until she is REALLY snoring.', goal: '🧸', path: [[70, 470], [300, 500], [580, 420], [800, 470], [830, 290]], snore: [1.6, 3.4], warn: 0.75, peek: [1.2, 2.6], fakes: 0.3 },
  { name: 'Sticker on Her Nose!', tip: 'Get all the way to the bed and put a silly sticker on her nose. Bravest mission ever!', goal: '⭐', path: [[70, 470], [260, 360], [520, 480], [800, 440], [740, 330], [640, 300]], snore: [1.2, 3], warn: 0.6, peek: [1, 2.8], fakes: 0.45 }
];
// ---- Snore Song levels ----
const SONGS = [
  { name: 'Snore Lullaby', tip: 'Tap when the note reaches the circle, right on her big SHOOO!', bpm: 76, bars: 8, extra: 0, goal: 'Tuck her in with stuffies' },
  { name: 'Snort Boogie', tip: 'Some snores have an extra little snort. Tap it too!', bpm: 92, bars: 10, extra: 0.35, goal: 'Throw her a sleepy party' },
  { name: 'Mega Snore Remix', tip: 'Her biggest snores yet! Stay on the beat.', bpm: 108, bars: 12, extra: 0.55, goal: 'Make her a princess' }
];
const DECOR = ['🧸', '🦄', '🐶', '⭐', '🌈', '🎈', '🌸', '💖', '🐱', '🎀', '🍩', '✨', '🐼', '🌟', '🦋', '🍭', '🐸', '🎉', '🌙', '💎', '🦖', '🍕', '🐙', '🎵', '🌻', '🐰', '🍓', '🎁', '🐢', '👑'];

/* ============ Input ============ */
const keys = {};
let holding = false, runHeld = false;
const joy = { on: false, id: null, sx: 0, sy: 0, dx: 0, dy: 0 };
addEventListener('keydown', e => {
  Snd.init();
  if (state !== 'play' && (e.code === 'Enter' || e.code === 'Space')) { const b = document.querySelector('.ov.show .btn.primary'); if (b) { e.preventDefault(); if (!e.repeat) b.click(); return; } }
  keys[e.code] = true;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' && !e.repeat && state === 'play' && mode === 2) tapBeat();
  if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) togglePause();
});
addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('pointerdown', e => {
  Snd.init();
  if (state !== 'play') return;
  if (mode === 2) { tapBeat(); return; }
  if (mode === 1) { holding = true; joy.id = e.pointerId; return; }
  joy.on = true; joy.id = e.pointerId; joy.sx = e.clientX; joy.sy = e.clientY; joy.dx = 0; joy.dy = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!joy.on || e.pointerId !== joy.id) return;
  const r = cv.getBoundingClientRect(), k = W / r.width;
  joy.dx = (e.clientX - joy.sx) * k; joy.dy = (e.clientY - joy.sy) * k;
});
const joyOff = e => { if (e.pointerId === joy.id) { joy.on = false; joy.dx = joy.dy = 0; holding = false; } };
cv.addEventListener('pointerup', joyOff); cv.addEventListener('pointercancel', joyOff);
cv.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
const ab = $('actBtn');
ab.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
ab.addEventListener('touchend', e => e.preventDefault(), { passive: false });
ab.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); Snd.init(); if (state !== 'play') return; if (mode === 2) tapBeat(); else if (mode === 1) holding = true; else runHeld = true; ab.classList.add('on'); try { ab.setPointerCapture(e.pointerId); } catch (err) {} });
const abOff = () => { runHeld = false; if (mode === 1) holding = false; ab.classList.remove('on'); };
ab.addEventListener('pointerup', abOff); ab.addEventListener('pointercancel', abOff);
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

/* ============ Gabby's sleep ============ */
// sleep: 'deep' (snoring, safe), 'light' (stirring, noise counts a LOT more), 'peek' (Freeze! only), 'awake'
function newGabby() { return { sleep: 'deep', t: 4, say: null, sayT: 0, snorePh: 0, roll: 0, fake: false, bubble: 0 }; }
function gabSay(text, t = 2) { gab.say = text; gab.sayT = t; }
function boySay(text, t = 1.4) { boy.say = text; boy.sayT = t; }
function addNoise(n, x, y) {
  const mult = gab.sleep === 'light' ? 2.6 : 0.8;
  meter = clamp(meter + n * mult * D().noise, 0, 100);
  meterMax = Math.max(meterMax, meter);
  if (n >= 8 && x !== undefined) parts.push({ k: 'ring', x, y, r: 6, life: 0.6, max: 0.6 });
  if (meter >= 100) wakeUp();
}
function wakeUp() {
  if (gab.sleep === 'awake') return;
  gab.sleep = 'awake'; gab.t = 2.2; wakeT = 2.2; hearts--; shake = 0.5;
  Snd.wake(); gabSay(pick(WAKE_LINES), 2);
  boySay(pick(['EEEK!', 'Uh oh...', 'I wasn’t here!', 'Run awaaay!']), 2);
  banner = { text: '😱 GABBY WOKE UP!', sub: hearts > 0 ? 'Freeze and wait for her to fall back asleep...' : '', t: 2 };
  parts.push({ k: 'pillow', x: 480, y: 150, vx: (boy.x - 480) * 1.6, vy: -260, life: 1.2, max: 1.2 });
  if (mode === 0) { boy.homeT = 1.2; }
  if (mode === 1) { fr.p = Math.max(0, fr.p - fr.len * 0.3); }
}
function updateGabby(dt, cyc) {
  gab.t -= dt; gab.sayT -= dt; gab.snorePh += dt;
  if (gab.sleep === 'deep') {
    // snore sound every ~2.4 s

    if (Math.random() < dt * 0.08 && gab.sayT < -3) { gabSay(pick(SLEEP_TALK), 2.2); Snd.mumble(); }

/* ============ Level setup ============ */
function setupLevel() {

  gab = newGabby();
  boy = { x: 70, y: 470, face: 1, walk: 0, moving: false, say: null, sayT: 0, homeT: 0, onBoard: -1 };
  items = []; hazards = []; carried = 0; fr = null; song = null; decor = [];
  if (mode === 0) {
    const L = SNEAK[level];

    hazards = L.hazards.map(([k, x, y, w]) => k === 'board' ? { k, x, y, w: w || 110, h: 26 } : { k, x, y, cool: 0 });
    gab.t = rand(L.light[0], L.light[1]);

  } else if (mode === 1) {

    const pts = L.path.map(([x, y]) => ({ x, y })); let len = 0; const segs = [];
    for (let i = 1; i < pts.length; i++) { const l = dist(pts[i - 1], pts[i]); segs.push({ a: pts[i - 1], b: pts[i], l, s: len }); len += l; }
    fr = { L, pts, segs, len, p: 0, grace: 0, warned: false };

  } else {

}
function buildSong(L) {

  for (let b = 0; b < L.bars; b++) {
    const t0 = lead + b * 4 * beat;
    const talk = L.bars > 8 && b === Math.floor(L.bars / 2); // a sleep talk break in the middle
    if (talk) { snores.push({ t: t0, k: 'talk' }); continue; }
    snores.push({ t: t0, k: 'in', d: beat * 1.7 });
    snores.push({ t: t0 + 2 * beat, k: 'out', d: beat * 1.4 });
    notes.push({ t: t0 + 2 * beat, k: 'shoo' });
    if (b > 0 && Math.random() < L.extra) { const tt = t0 + 3 * beat + (Math.random() < 0.5 ? 0 : beat * 0.5); notes.push({ t: tt, k: 'snort' }); snores.push({ t: tt, k: 'snort' }); }
  }

}

/* ============ Update ============ */
function update(dt) {
  time += dt; lvT += dt;
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (wakeT > 0) wakeT -= dt;
  if (boy.sayT > 0) boy.sayT -= dt;
  for (const p of parts) { p.life -= dt; if (p.vx !== undefined) { p.x += p.vx * dt; p.y += p.vy * dt; if (p.k === 'pillow') p.vy += 500 * dt; } if (p.k === 'ring') p.r += 140 * dt; if (p.k === 'z') { p.x += Math.sin(p.life * 4) * 0.5; p.y -= 22 * dt; } }
  parts = parts.filter(p => p.life > 0);
  if (gab.sleep === 'deep' && Math.random() < dt * 1.2) parts.push({ k: 'z', x: 510 + rand(0, 20), y: 170, life: 2.2, max: 2.2, s: rand(14, 24) });
  if (mode === 0) updateSneak(dt);
  else if (mode === 1) updateFreeze(dt);
  else updateSong(dt);
  meter = Math.max(0, meter - dt * (mode === 2 ? 2.5 : gab.sleep === 'deep' ? 5 : 2) * D().decay);
}

// ---- Sneaky Mission ----
function sneakCycle(what) {
  const L = SNEAK[level];
  if (what === 'toLight') { gab.sleep = 'light'; gab.t = rand(L.lightLen[0], L.lightLen[1]) * (settings.diff === 'easy' ? 0.8 : 1); Snd.stir(); gabSay(pick(['Mmmh...?', 'Hmmm...', '*sniff sniff*', 'Wha...?']), 1.5); }
  else { gab.sleep = 'deep'; gab.t = rand(L.light[0], L.light[1]) * D().slow; }
}
function blocked(x, y) {
  if (x < 24 || x > W - 24 || y < FLOOR + 14 || y > H - 14) return true;
  for (const s of ROOM_SOLID) if (x > s.x - 12 && x < s.x + s.w + 12 && y > s.y - 4 && y < s.y + s.h + 10) return true;
  return false;
}
function updateSneak(dt) {
  updateGabby(dt, sneakCycle);
  if (state !== 'play') return;
  if (boy.homeT > 0) { boy.homeT -= dt; return; } // frozen in shock while she yells
  let mx = 0, my = 0;
  if (keys.ArrowLeft || keys.KeyA) mx -= 1; if (keys.ArrowRight || keys.KeyD) mx += 1;
  if (keys.ArrowUp || keys.KeyW) my -= 1; if (keys.ArrowDown || keys.KeyS) my += 1;
  if (joy.on && Math.hypot(joy.dx, joy.dy) > 10) { const l = Math.hypot(joy.dx, joy.dy); mx = joy.dx / l; my = joy.dy / l; }
  const ml = Math.hypot(mx, my);
  const running = (keys.ShiftLeft || keys.ShiftRight || runHeld) && ml > 0;
  boy.moving = ml > 0.1 && gab.sleep !== 'awake';
  if (boy.moving) {
    const sp = running ? 230 : 115;
    const vx = mx / ml * sp * dt, vy = my / ml * sp * dt * 0.8;
    if (!blocked(boy.x + vx, boy.y)) boy.x += vx;
    if (!blocked(boy.x, boy.y + vy)) boy.y += vy;
    if (Math.abs(mx) > 0.2) boy.face = mx > 0 ? 1 : -1;
    boy.walk += dt * (running ? 16 : 9);
    const stepEvery = running ? 0.22 : 0.4;
    boy.stepT = (boy.stepT || 0) - dt;
    if (boy.stepT <= 0) { boy.stepT = stepEvery; Snd.step(); }
    addNoise((running ? 15 : 2.6) * dt);
    if (running && Math.random() < dt * 4) parts.push({ k: 'puff', x: boy.x - boy.face * 12, y: boy.y, life: 0.4, max: 0.4 });
  }
  // hazards
  let onBoard = -1;
  hazards.forEach((h, i) => {
    if (h.k === 'board') { if (boy.x > h.x && boy.x < h.x + h.w && boy.y > h.y && boy.y < h.y + h.h + 6) onBoard = i; }
    else { h.cool -= dt; if (h.cool <= 0 && Math.hypot(boy.x - h.x, boy.y - h.y) < 24) { h.cool = 1.2; Snd.squeak(); addNoise(32, h.x, h.y); parts.push({ k: 'text', text: 'SQUEAK!', x: h.x, y: h.y - 30, life: 0.9, max: 0.9, c: '#ffd23f' }); boySay(pick(['Oops!', 'Shhh, duck!', 'Eep!']), 1); } }
  });
  if (onBoard >= 0 && onBoard !== boy.onBoard && boy.moving) { const h = hazards[onBoard]; Snd.creak(); addNoise(20, boy.x, boy.y); parts.push({ k: 'text', text: 'CREEEAK', x: boy.x, y: boy.y - 70, life: 0.9, max: 0.9, c: '#ffb36b' }); }
  boy.onBoard = onBoard;
  // items
  for (const it of items) if (!it.got && Math.hypot(boy.x - it.x, boy.y - it.y) < 30) { it.got = true; carried++; Snd.grab(); parts.push({ k: 'text', text: it.e + ' Got it!', x: it.x, y: it.y - 40, life: 1, max: 1, c: '#7dffb0' }); }
  // door

}

// ---- Freeze! ----
function freezeCycle(what) {
  const L = fr.L;
  if (what === 'toLight') {
    gab.sleep = 'light'; gab.t = L.warn * (settings.diff === 'easy' ? 1.35 : 1); gab.fake = Math.random() < L.fakes; Snd.stir();
    gabSay(pick(['Mmmh...?', 'Hmmm...', '*rolls over*', 'Wha...?']), L.warn);
  } else if (gab.sleep === 'light') {
    if (gab.fake) { gab.sleep = 'deep'; gab.t = rand(L.snore[0], L.snore[1]) * D().slow; gabSay('...zzz. Fooled ya, sleepyhead!', 1.2); }
    else { gab.sleep = 'peek'; gab.t = rand(L.peek[0], L.peek[1]); fr.grace = 0.18; Snd.peek(); }
  }
}
function updateFreeze(dt) {
  const L = fr.L;
  if (gab.sleep === 'peek') {
    gab.t -= dt; gab.sayT -= dt; fr.grace -= dt;
    if (holding || keys.Space || keys.ArrowRight || keys.ArrowUp || keys.KeyD) {
      if (fr.grace <= 0) { meter = 100; wakeUp(); fr.peekFail = true; }
    }
    if (gab.t <= 0 && gab.sleep === 'peek') { gab.sleep = 'deep'; gab.t = rand(L.snore[0], L.snore[1]) * D().slow; gabSay(pick(['...hmm. Nothing there. Zzz', '...must be the cat. Zzz', 'Zzz... zzz...']), 1.6); }
  } else updateGabby(dt, freezeCycle);
  if (state !== 'play') return;
  const go = (holding || keys.Space || keys.ArrowRight || keys.ArrowUp || keys.KeyD) && gab.sleep !== 'awake' && gab.sleep !== 'peek';
  boy.moving = go;
  if (go) {
    fr.p = Math.min(fr.len, fr.p + 105 * dt);
    boy.walk += dt * 9; boy.stepT = (boy.stepT || 0) - dt; if (boy.stepT <= 0) { boy.stepT = 0.4; Snd.step(); }
    if (gab.sleep === 'light') addNoise(4 * dt);
  }
  // position along path
  const p = fr.p;
  let seg = fr.segs[fr.segs.length - 1];
  for (const s of fr.segs) if (p <= s.s + s.l) { seg = s; break; }
  const k = clamp((p - seg.s) / seg.l, 0, 1);
  const nx = seg.a.x + (seg.b.x - seg.a.x) * k, ny = seg.a.y + (seg.b.y - seg.a.y) * k;
  if (Math.abs(nx - boy.x) > 0.3) boy.face = nx > boy.x ? 1 : -1;
  boy.x = nx; boy.y = ny;
  if (fr.p >= fr.len - 0.5) levelDone();
}

// ---- Snore Song ----
const HIT_X = 210, LANE_Y = 488, PX_PER_S = 260;
function tapBeat() {
  if (state !== 'play' || !song || gab.sleep === 'awake') return;
  const t = song.clock;
  let bestN = null, bd = 9;
  for (const n of song.notes) if (!n.hit && !n.missed) { const d = Math.abs(n.t - t); if (d < bd) { bd = d; bestN = n; } }
  song.flash = 0.12;
  if (bestN && bd < 0.19) {
    bestN.hit = true; const perfect = bd < 0.075;
    song.hits++; if (perfect) song.perfect++; song.combo++; song.best = Math.max(song.best, song.combo);
    song.judge = perfect ? 'PERFECT!' : 'Nice!'; song.judgeT = 0.6;
    Snd.hit(perfect);
    placeDecor();
  } else {
    song.combo = 0; song.judge = 'Too loud!'; song.judgeT = 0.6; Snd.miss();
    addNoise(18, HIT_X, LANE_Y);
  }
}
function placeDecor() {
  const i = decor.length;
  // spots around her on the bed, then on her head at the end
  const spots = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 8; c++) spots.push({ x: 340 + c * 40 + (r % 2) * 18 + r * 6, y: 240 + r * 24 });
  const sp = spots[(i * 7) % spots.length];
  decor.push({ e: DECOR[i % DECOR.length], x: sp.x + rand(-6, 6), y: sp.y + rand(-4, 4), pop: 0.4 });
  parts.push({ k: 'spark', x: sp.x, y: sp.y, life: 0.5, max: 0.5 });
}
function updateSong(dt) {
  updateGabby(dt, null);
  if (state !== 'play') return;
  if (gab.sleep === 'awake') return;      // music waits while she yells
  song.clock += dt;
  song.flash = Math.max(0, song.flash - dt); song.judgeT -= dt;
  for (const d of decor) d.pop = Math.max(0, d.pop - dt);
  // snore sounds on the beat
  while (song.si < song.snores.length && song.snores[song.si].t <= song.clock) {
    const s = song.snores[song.si++];
    if (s.k === 'in') { Snd.snoreIn(s.d); song.breath = s.d; song.breathK = 'in'; song.breathT = 0; }
    else if (s.k === 'out') { Snd.snoreOut(s.d); song.breathK = 'out'; song.breathT = 0; song.breath = s.d; }
    else if (s.k === 'snort') { Snd.tone(110, 0.12, 'sawtooth', 0.12, 80); Snd.noise(0.1, 0.1, 600); }
    else if (s.k === 'talk') { gabSay(pick(SLEEP_TALK), 2.4); Snd.mumble(); }
  }

/* ============ Drawing helpers ============ */

function txt(s, x, y, size, color = '#fff', outline = '#1e1a2e', align = 'center') {
  ctx.font = '900 ' + size + 'px "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif';
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = outline; ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function emoji(e, x, y, size) { ctx.font = size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); }

  if (ctx.measureText(text).width > 250) ctx.font = '900 13px "Trebuchet MS", sans-serif';
  const w = Math.min(290, ctx.measureText(text).width + 24);
  const bx = clamp(x - w / 2, 4, W - w - 4), by = y - 36;
  rrect(bx, by, w, 28, 13, '#ffffff'); poly([x - 7, by + 27, x + 7, by + 27, x, by + 36], '#ffffff');
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, bx + w / 2, by + 14);
}

/* ============ The little brother ============ */
const BOY = { skin: '#f2c9a0', hair: '#6b4220', shirt: '#3a86ff', pants: '#2b3a5a' };
function drawBoy(x, y, s = 1.7) {
